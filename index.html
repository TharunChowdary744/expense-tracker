<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ledgerly</title>
    <script>
      // GitHub Pages: 404.html sends unknown paths here as ?__route=<path>; put the path back.
      ;(function () {
        var route = new URLSearchParams(location.search).get('__route')
        if (route) history.replaceState(null, '', location.pathname.replace(/\/?$/, '/') + route)
      })()
    </script>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ledgerly-theme')
        var dark =
          t === 'dark' ||
          ((t === null || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
