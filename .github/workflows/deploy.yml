name: Deploy

# A merged PR lands as a push on the target branch, which deploys that environment:
#   develop -> dev    test -> test    prod -> prod
# The app is hosted on GitHub Pages (gh-pages branch), one folder per environment:
#   prod -> /<repo>/    test -> /<repo>/test/    dev -> /<repo>/dev/
# Each GitHub Environment (dev, test, prod) holds its own Firebase web config secrets.
# Nothing is deployed to Firebase unless FIREBASE_DEPLOY_ONLY is set. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [develop, test, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the build to the gh-pages branch
    environment:
      name: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name }}
      # Shown on the run page and under Deployments / Environments in GitHub.
      url: ${{ steps.publish.outputs.url }}
    if: contains(fromJSON('["develop","test","prod"]'), github.ref_name)
    env:
      APP_ENV: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the GitHub Pages folder and URL
        id: site
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$APP_ENV" = prod ]; then folder=""; else folder="$APP_ENV/"; fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "base=/$repo/$folder" >> "$GITHUB_OUTPUT"
          echo "url=https://$owner.github.io/$repo/$folder" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      - name: Build with environment config
        env:
          BASE_PATH: ${{ steps.site.outputs.base }}
          VITE_USE_EMULATORS: 'false'
          VITE_APP_ENV: ${{ env.APP_ENV }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Receipts stay hidden unless this repo or Environment variable is "true".
          VITE_RECEIPTS_ENABLED: ${{ vars.VITE_RECEIPTS_ENABLED }}
        run: npm run build

      # Copies the build into this environment's folder on the gh-pages branch, leaving the
      # other environments' folders alone. Retries if another environment pushed first.
      - name: Publish to GitHub Pages
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOLDER: ${{ steps.site.outputs.folder }}
          URL: ${{ steps.site.outputs.url }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          site="$RUNNER_TEMP/site"
          for attempt in 1 2 3 4; do
            rm -rf "$site"
            if ! git clone --quiet --depth 1 --branch gh-pages "$remote" "$site" 2>/dev/null; then
              git init --quiet -b gh-pages "$site"
              git -C "$site" remote add origin "$remote"
            fi
            if [ -z "$FOLDER" ]; then
              # prod lives at the root: replace everything except the other environments.
              find "$site" -mindepth 1 -maxdepth 1 ! -name .git ! -name dev ! -name test -exec rm -rf {} +
            else
              rm -rf "${site:?}/$FOLDER"
              mkdir -p "$site/$FOLDER"
            fi
            cp -R dist/. "$site/$FOLDER"
            # Pages only uses the root 404.html; it routes unknown paths to the right environment.
            cp dist/404.html "$site/404.html"
            touch "$site/.nojekyll"
            git -C "$site" add -A
            if git -C "$site" diff --cached --quiet; then
              echo "No changes to publish."
              break
            fi
            git -C "$site" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "deploy ${APP_ENV} from ${GITHUB_SHA}"
            if git -C "$site" push --quiet origin gh-pages; then break; fi
            [ "$attempt" = 4 ] && { echo "Could not push to gh-pages"; exit 1; }
            sleep $((attempt * 5))
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed ${APP_ENV}"
            echo
            echo "App URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Firebase deploys are off: the app is hosted on GitHub Pages. To push Firestore rules and
      # indexes from CI again, set the repo or Environment variable FIREBASE_DEPLOY_ONLY, e.g.
      # "firestore" (add ",storage" when receipts are on). The service account then needs the
      # roles listed in docs/DEPLOYMENT.md.
      - name: Authenticate to Google Cloud
        if: vars.FIREBASE_DEPLOY_ONLY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase rules and indexes
        if: vars.FIREBASE_DEPLOY_ONLY != ''
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          DEPLOY_ONLY: ${{ vars.FIREBASE_DEPLOY_ONLY }}
        run: npx --yes firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only "$DEPLOY_ONLY" --non-interactive
